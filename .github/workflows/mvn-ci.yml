name: CI Pipeline with Maven

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master


permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: subscription_service_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subscription_service_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean -B package --file pom.xml -Dspring.profiles.active=test

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"

          MESSAGE="🚀 CI Pipeline Status: ${STATUS}

          Project: \#$(basename ${{ github.repository }} | sed 's/-/\\-/g')
          Branch: \`${{ github.ref }}\`
          Commit: \`${{ github.sha }}\`

          [Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=${MESSAGE}" \
          -d "parse_mode=MarkdownV2"